<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio — Life Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F6EF;
    --surface: #FFFFFF;
    --surface-raised: #FFFFFF;
    --ink: #2E3529;
    --ink-soft: #6B7263;
    --ink-faint: #9CA391;
    --accent-green: #4F6B47;
    --accent-green-soft: #7C9473;
    --accent-green-wash: #E7ECE1;
    --accent-rust: #C17A54;
    --accent-rust-wash: #F2E3D6;
    --accent-mustard: #B98A3E;
    --accent-mustard-wash: #F1E5CB;
    --border: #E1E3D5;
    --border-soft: #ECEEE3;
    --danger: #B0523A;
    --shadow: 0 1px 2px rgba(46,53,41,0.04), 0 10px 28px rgba(46,53,41,0.05);
    --radius: 20px;
    --radius-sm: 13px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1A1D16;
      --surface: #21251C;
      --surface-raised: #262A1F;
      --ink: #EBEDE3;
      --ink-soft: #BAC0AD;
      --ink-faint: #7D8471;
      --accent-green: #9BB68E;
      --accent-green-soft: #7C9473;
      --accent-green-wash: #29301F;
      --accent-rust: #D99468;
      --accent-rust-wash: #362A20;
      --accent-mustard: #D9AF66;
      --accent-mustard-wash: #362B19;
      --border: #343829;
      --border-soft: #2A2E20;
      --danger: #E08262;
      --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 10px 28px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1A1D16;
    --surface: #21251C;
    --surface-raised: #262A1F;
    --ink: #EBEDE3;
    --ink-soft: #BAC0AD;
    --ink-faint: #7D8471;
    --accent-green: #9BB68E;
    --accent-green-soft: #7C9473;
    --accent-green-wash: #29301F;
    --accent-rust: #D99468;
    --accent-rust-wash: #362A20;
    --accent-mustard: #D9AF66;
    --accent-mustard-wash: #362B19;
    --border: #343829;
    --border-soft: #2A2E20;
    --danger: #E08262;
    --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 10px 28px rgba(0,0,0,0.3);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Nunito Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
  }
  h1, h2, h3, .display { font-family: 'Playfair Display', Georgia, serif; font-weight: 600; }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }
  @media (max-width: 640px) { .wrap { padding: 24px 16px 64px; } }

  header.top {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
    margin-bottom: 30px;
    padding-bottom: 22px;
    border-bottom: 1px solid var(--border-soft);
  }
  header.top .greet { position: relative; }
  header.top .site-wordmark {
    font-family: 'Alex Brush', cursive;
    font-size: 44px;
    line-height: 1;
    color: var(--accent-rust);
    margin: 0 0 2px;
  }
  header.top .greet h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 450;
    letter-spacing: -0.01em;
    color: var(--ink-soft);
    position: relative;
    display: inline-block;
  }
  header.top .greet-stroke {
    display: block;
    width: 66px;
    height: 8px;
    margin-top: 1px;
  }
  header.top .greet-stroke path {
    fill: none;
    stroke: var(--accent-rust);
    stroke-width: 2.5;
    stroke-linecap: round;
    opacity: 0.55;
  }
  header.top .greet p {
    margin: 4px 0 0;
    color: var(--ink-faint);
    font-size: 13px;
  }
  .save-indicator {
    font-size: 12px;
    color: var(--ink-faint);
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .save-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-green-soft); }
  .save-dot.busy { background: var(--accent-mustard); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.4; } }

  .banner {
    background: var(--accent-mustard-wash);
    border: 1px solid var(--border);
    color: var(--ink);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    font-size: 13px;
    margin-bottom: 20px;
    display: none;
  }
  .banner.show { display: block; }

  .tabbar {
    display: flex; gap: 6px; margin-bottom: 20px;
    border-bottom: 1px solid var(--border-soft);
    overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  .tab-btn {
    font-family: 'Nunito Sans', sans-serif; font-size: 13.5px; font-weight: 600;
    background: none; border: none; cursor: pointer; color: var(--ink-faint);
    padding: 9px 4px 12px; margin-right: 18px; position: relative;
    white-space: nowrap; flex-shrink: 0;
  }
  .tab-btn::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
    background: var(--accent-green); border-radius: 2px; opacity: 0; transform: scaleX(0.6);
    transition: opacity .15s ease, transform .15s ease;
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active { color: var(--ink); }
  .tab-btn.active::after { opacity: 1; transform: scaleX(1); }
  #mealsView { max-width: 900px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 20px 18px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    min-height: 168px;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute; top: 0; left: 20px; right: 20px; height: 3px;
    border-radius: 0 0 3px 3px;
    background: var(--card-accent, var(--accent-green-soft));
    opacity: 0.55;
  }
  .card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
  .card:hover::before { opacity: 0.9; }
  .card.dragging { opacity: 0.4; }
  .card.drag-over { outline: 2px dashed var(--accent-green-soft); outline-offset: 3px; }
  .card.span-2 { grid-column: span 2; }
  @media (max-width: 600px) { .card.span-2 { grid-column: span 1; } }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .card-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    font-weight: 600;
  }
  .card-icon {
    width: 30px; height: 30px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }
  .icon-meal { background: var(--accent-rust-wash); color: var(--accent-rust); }
  .icon-workout { background: var(--accent-green-wash); color: var(--accent-green); }
  .icon-content { background: var(--accent-mustard-wash); color: var(--accent-mustard); }
  .icon-hobby { background: var(--accent-green-wash); color: var(--accent-green); }
  .icon-cal { background: var(--accent-rust-wash); color: var(--accent-rust); }

  .drag-handle { cursor: grab; color: var(--ink-faint); font-size: 14px; padding: 2px 4px; }
  .drag-handle:active { cursor: grabbing; }

  .card-body { flex: 1; font-size: 13px; color: var(--ink-soft); line-height: 1.6; }
  .card-body strong { color: var(--ink); font-weight: 600; }
  .empty-hint { color: var(--ink-faint); font-style: italic; }

  .mini-row { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; }
  .mini-list { display: flex; flex-direction: column; gap: 2px; }
  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; padding: 2px 8px; border-radius: 20px;
    background: var(--border-soft); color: var(--ink-soft);
  }
  .streak-dots { display: flex; gap: 4px; margin-top: 6px; }
  .streak-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--border); }
  .streak-dot.done { background: var(--accent-green); }

  .card-foot { font-size: 12px; color: var(--ink-faint); display: flex; justify-content: space-between; align-items: center; }
  .open-link { color: var(--accent-green); font-weight: 500; }

  /* Modal */
  .overlay {
    position: fixed; inset: 0; background: rgba(20,18,13,0.45);
    display: none; align-items: center; justify-content: center;
    padding: 20px; z-index: 50;
    padding-top: calc(20px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  }
  .overlay.show { display: flex; }
  .modal {
    background: var(--surface-raised);
    border-radius: 18px;
    width: 100%; max-width: 680px;
    max-height: 86vh;
    display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    overflow: hidden;
  }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 22px; border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .modal-head h2 { margin: 0; font-size: 20px; font-weight: 500; display:flex; align-items:center; gap:10px; }
  .modal-close {
    background: none; border: none; font-size: 20px; color: var(--ink-faint);
    cursor: pointer; padding: 4px 8px; border-radius: 8px; line-height: 1;
  }
  .modal-close:hover { background: var(--border-soft); color: var(--ink); }
  .modal-body { padding: 20px 22px; overflow-y: auto; }

  input, textarea, select {
    font-family: inherit; font-size: 13px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 11px; width: 100%;
  }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent-green-soft); outline-offset: 1px; }
  textarea { resize: vertical; min-height: 44px; font-family: inherit; border-radius: 14px; }
  button.btn {
    font-family: inherit; font-size: 13px; font-weight: 600;
    border-radius: 999px; padding: 9px 18px; cursor: pointer; border: 1px solid transparent;
  }
  .btn-primary { background: var(--accent-green); color: #fff; }
  .btn-primary:hover { background: var(--accent-green-soft); }
  .btn-ghost { background: transparent; border-color: var(--border); color: var(--ink); }
  .btn-ghost:hover { background: var(--border-soft); }
  .btn-danger { background: transparent; color: var(--danger); border-color: transparent; font-size: 12px; padding: 4px 8px; border-radius: 999px; }
  .btn-danger:hover { background: var(--accent-rust-wash); }
  :focus-visible { outline: 2px solid var(--accent-green-soft); outline-offset: 2px; }

  /* Meal planner table */
  .meal-table { width: 100%; border-collapse: collapse; }
  .meal-table th { text-align: left; font-size: 11px; color: var(--ink-faint); font-weight: 500; padding: 6px 8px; }
  .meal-table td { padding: 4px 6px; vertical-align: top; }
  .meal-table td input { font-size: 12px; padding: 6px 8px; }

  .meal-photo-add {
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 24px; border-radius: 8px; border: 1px dashed var(--border);
    color: var(--ink-faint); font-size: 12px; cursor: pointer; margin-top: 2px;
    transition: border-color .15s ease, color .15s ease;
  }
  .meal-photo-add:hover { border-color: var(--accent-rust); color: var(--accent-rust); }
  .meal-thumb-wrap { position: relative; margin-top: 2px; }
  .meal-thumb {
    width: 100%; height: 46px; object-fit: cover; border-radius: 8px;
    cursor: pointer; display: block; border: 1px solid var(--border-soft);
  }
  .meal-thumb-remove {
    position: absolute; top: -5px; right: -5px; width: 17px; height: 17px;
    border-radius: 50%; background: var(--surface-raised); border: 1px solid var(--border);
    color: var(--ink-faint); font-size: 9px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .meal-thumb-remove:hover { color: var(--danger); border-color: var(--danger); }

  .week-nav {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 6px; flex-wrap: wrap;
  }
  .week-nav-title { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .week-nav-title strong { font-family: 'Playfair Display', serif; font-weight: 600; font-size: 17px; }
  .week-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px;
  }
  @media (max-width: 760px) { .week-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 460px) { .week-grid { grid-template-columns: 1fr; } }
  .week-day-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 12px; display: flex; flex-direction: column; gap: 10px;
  }
  .week-day-card.is-today { border-color: var(--accent-rust); box-shadow: 0 0 0 1px var(--accent-rust); }
  .week-day-head { display: flex; flex-direction: column; gap: 1px; padding-bottom: 8px; border-bottom: 1px solid var(--border-soft); }
  .week-day-dow { font-family: 'Playfair Display', serif; font-weight: 600; font-size: 15px; }
  .week-day-num { font-size: 11.5px; color: var(--ink-faint); }
  .week-meal-block { display: flex; flex-direction: column; gap: 4px; }
  .week-meal-label { font-size: 10.5px; font-weight: 700; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.04em; }
  .week-meal-name { font-size: 12.5px; color: var(--ink); }
  .week-day-card .meal-thumb { height: 96px; border-radius: 10px; }
  .week-thumb-readonly { cursor: default; }

  .today-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  @media (max-width: 820px) { .today-grid { grid-template-columns: 1fr; } }
  .today-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; display: flex; flex-direction: column; gap: 12px;
  }
  .today-card-head { display: flex; align-items: center; gap: 10px; }
  .today-card-head strong { font-size: 15px; font-weight: 600; flex: 1; }
  .today-link { font-size: 12px; padding: 5px 12px; }
  .today-meal-row { display: flex; align-items: center; gap: 12px; }
  .today-meal-thumb { width: 52px; height: 52px; border-radius: 12px; object-fit: cover; flex-shrink: 0; cursor: pointer; }
  .today-meal-thumb-empty {
    display: flex; align-items: center; justify-content: center; font-size: 18px;
    background: var(--border-soft); color: var(--ink-faint); cursor: default;
  }
  .today-meal-label { font-size: 10.5px; font-weight: 700; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.04em; }
  .today-meal-name { font-size: 13.5px; margin-top: 1px; }
  .today-workout-focus { font-size: 15px; font-weight: 600; }
  .today-workout-notes { font-size: 12.5px; color: var(--ink-soft); }
  .today-done-toggle {
    display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-soft);
    margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border-soft);
  }
  .today-done-toggle input { width: auto; }
  .today-event-row { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 4px 0; }

  .vision-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; gap: 12px; flex-wrap: wrap; }
  .vision-upload-btn { cursor: pointer; }
  .vision-board { columns: 3 220px; column-gap: 14px; }
  @media (max-width: 700px) { .vision-board { columns: 2 150px; } }
  .vision-item {
    position: relative; break-inside: avoid; margin-bottom: 14px;
    border-radius: 16px; overflow: hidden; border: 1px solid var(--border);
  }
  .vision-item img { width: 100%; display: block; cursor: pointer; }
  .vision-remove {
    position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 50%;
    background: rgba(20,18,13,0.5); color: #fff; border: none; cursor: pointer; font-size: 11px;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .vision-remove:hover { background: var(--danger); }
  .vision-empty {
    border: 2px dashed var(--border); border-radius: var(--radius);
    padding: 70px 20px; text-align: center; color: var(--ink-faint);
  }
  .day-label { font-size: 12px; font-weight: 600; padding-top: 10px !important; white-space: nowrap; }

  .section-label { font-size: 12px; font-weight: 600; color: var(--ink-soft); margin: 18px 0 8px; text-transform: none; }
  .section-label:first-child { margin-top: 0; }

  .checklist-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
  .checklist-row input[type="checkbox"] { width: auto; flex-shrink: 0; }
  .checklist-row span { flex: 1; font-size: 13px; }
  .checklist-row.checked span { text-decoration: line-through; color: var(--ink-faint); }
  .add-row { display: flex; gap: 8px; margin-top: 10px; }
  .add-row input { flex: 1; }

  /* Workout */
  .workout-day { border: 1px solid var(--border-soft); border-radius: 16px; padding: 12px 14px; margin-bottom: 10px; }
  .workout-day-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .workout-day-head strong { font-size: 13px; }

  /* Kanban */
  .kanban { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (max-width: 560px) { .kanban { grid-template-columns: 1fr; } }
  .kanban-col { background: var(--surface); border-radius: 16px; padding: 10px; min-height: 120px; }
  .kanban-col h4 { margin: 0 0 8px; font-size: 12px; color: var(--ink-soft); font-weight: 600; }
  .kanban-card {
    background: var(--surface-raised); border: 1px solid var(--border-soft); border-radius: 12px;
    padding: 8px 10px; font-size: 12.5px; margin-bottom: 8px; cursor: grab;
  }
  .kanban-card.dragging { opacity: 0.4; }
  .kanban-col.drag-over { outline: 2px dashed var(--accent-green-soft); outline-offset: 2px; }

  /* Hobbies */
  .hobby-item { border: 1px solid var(--border-soft); border-radius: 16px; padding: 12px 14px; margin-bottom: 10px; }
  .hobby-item-head { display: flex; justify-content: space-between; align-items: center; }
  .hobby-item-head strong { font-size: 13.5px; }
  .hobby-notes { font-size: 12.5px; color: var(--ink-soft); margin-top: 6px; white-space: pre-wrap; }

  /* Calendar / events */
  .event-row { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--border-soft); }
  .event-row:last-child { border-bottom: none; }
  .event-date-badge {
    background: var(--accent-rust-wash); color: var(--accent-rust); border-radius: 12px;
    padding: 4px 9px; font-size: 11px; font-weight: 600; white-space: nowrap; flex-shrink: 0;
  }
  .event-info { flex: 1; }
  .event-info strong { font-size: 13px; }
  .event-info p { margin: 2px 0 0; font-size: 12px; color: var(--ink-soft); }
  .event-form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
  .event-form .full { grid-column: span 2; }

  .empty-state { text-align: center; padding: 30px 10px; color: var(--ink-faint); font-size: 13px; }

  .toast {
    position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--bg);
    padding: 10px 18px; border-radius: 20px; font-size: 12.5px;
    opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease;
    z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="greet">
      <div class="site-wordmark">Jataya's Dashboard</div>
      <h1 id="greetTitle">Studio</h1>
      <svg class="greet-stroke" viewBox="0 0 92 10" aria-hidden="true"><path d="M2 6.5C18 3 34 2 46 5C58 8 74 7 90 3.5"/></svg>
      <p id="greetDate"></p>
    </div>
    <div class="save-indicator"><span class="save-dot" id="saveDot"></span><span id="saveText">Saved</span></div>
  </header>

  <div class="banner" id="offlineBanner">Couldn't reach the cloud database — your changes are being saved on this device only until it's back.</div>

  <div class="tabbar" id="tabbar">
    <button class="tab-btn active" data-tab="home">Home</button>
    <button class="tab-btn" data-tab="today">Today</button>
    <button class="tab-btn" data-tab="dashboard">Dashboard</button>

  // ---------- Utilities ----------
  function lsGet(k){ try{ return localStorage.getItem(k); } catch{ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); } catch{} }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function todayDayName(){
    const idx = new Date().getDay(); // 0=Sun
    return DAYS[(idx+6)%7];
  }
  function mondayOf(date){
    const d = new Date(date);
    const diff = (d.getDay()===0 ? -6 : 1 - d.getDay());
    d.setDate(d.getDate()+diff);
    d.setHours(0,0,0,0);
    return d;
  }
  function isoDate(d){ return d.toISOString().slice(0,10); }
  function ensureCurrentWeekStart(){
    if(!state.currentWeekStart) state.currentWeekStart = isoDate(mondayOf(new Date()));
  }
  function weekDatesFor(weekStartISO){
    const start = new Date(weekStartISO+'T00:00:00');
    return DAYS.map((name, i)=>{
      const d = new Date(start);
      d.setDate(start.getDate()+i);
      return { name, date: d, iso: isoDate(d) };
    });
  }
  function fmtDayHeader(d){
    return { dow: d.toLocaleDateString(undefined,{weekday:'short'}), num: d.toLocaleDateString(undefined,{month:'short', day:'numeric'}) };
  }
  function fmtWeekRange(weekStartISO){
    const dates = weekDatesFor(weekStartISO);
    const start = dates[0].date, end = dates[6].date;
    const startStr = start.toLocaleDateString(undefined,{month:'short', day:'numeric'});
    const endStr = end.toLocaleDateString(undefined, start.getMonth()===end.getMonth() ? {day:'numeric'} : {month:'short', day:'numeric'});
    return `${startStr} – ${endStr}, ${end.getFullYear()}`;
  }
  function compressImageFile(file, maxWidth=440, quality=0.72){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = ()=>{
        const img = new Image();
        img.onload = ()=>{
          let w = img.width, h = img.height;
          if(w > maxWidth){ h = Math.round(h * (maxWidth / w)); w = maxWidth; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = () => reject(new Error('Could not read that image'));
        img.src = reader.result;
      };
      reader.onerror = () => reject(new Error('Could not read that file'));
      reader.readAsDataURL(file);
    });
  }
  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._h);
    showToast._h = setTimeout(()=>t.classList.remove('show'), 2200);
  }
  function setSaveStatus(busy){
    const dot = document.getElementById('saveDot');
    const txt = document.getElementById('saveText');
    if(busy){ dot.classList.add('busy'); txt.textContent = 'Saving…'; }
    else { dot.classList.remove('busy'); txt.textContent = dbReady ? 'Saved' : 'Saved locally only'; }
  }

  function greet(){

    document.getElementById('greetDate').textContent = new Date().toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });

  // ---------- DB layer (Supabase, mirrors the portfolio site's pattern) ----------
  async function load(){
    let loaded = false;
    try{
      const r = await fetch(SB_URL+'/rest/v1/portfolio_data?id=eq.'+SB_ROW+'&select=data', {
        headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
      });
      if(r.ok){
        const rows = await r.json();
        if(rows.length && rows[0].data && Object.keys(rows[0].data).length > 0){
          state = Object.assign({}, DEFAULT_STATE, rows[0].data);
          loaded = true;
          dbReady = true;
        }
      }
    } catch(e){ console.warn('Supabase load failed, falling back to localStorage', e); }
    if(!loaded){
      try{
        const raw = lsGet(LS_KEY);
        state = raw ? Object.assign({}, DEFAULT_STATE, JSON.parse(raw)) : structuredClone(DEFAULT_STATE);
      } catch{ state = structuredClone(DEFAULT_STATE); }
      dbReady = false;
      document.getElementById('offlineBanner').classList.add('show');
    }
    lsSet(LS_KEY, JSON.stringify(state));
    ensureCurrentWeekStart();
    setSaveStatus(false);
    renderGrid();
    if(document.getElementById('homeView').style.display !== 'none'){
      renderHomeView(document.getElementById('homeView'));
    }
    if(document.getElementById('todayView').style.display !== 'none'){
      renderTodayView(document.getElementById('todayView'));
    }
    if(document.getElementById('mealsView').style.display !== 'none'){
      renderMealsModal(document.getElementById('mealsView'));
    }
  }

  async function save(){
    setSaveStatus(true);
    try{ lsSet(LS_KEY, JSON.stringify(state)); } catch{}
    try{
      const r = await fetch(SB_URL+'/rest/v1/portfolio_data', {
        method:'POST',
        headers:{
          'apikey':SB_KEY,
          'Authorization':'Bearer '+SB_KEY,
          'Content-Type':'application/json',
          'Prefer':'resolution=merge-duplicates'
        },
        body: JSON.stringify({ id:SB_ROW, data:state, updated_at: new Date().toISOString() })
      });
      dbReady = r.ok;
      if(!r.ok) showToast('Saved on this device — cloud sync failed');
    } catch(e){
      console.warn('Supabase save failed:', e);
      dbReady = false;
      showToast('Saved on this device — cloud sync failed');
    }
    setSaveStatus(false);
  }
  // Thin wrappers so every existing call site (saveDoc/deleteDoc) keeps working unchanged —
  // this app now persists the whole state as one blob per save, same as the portfolio site.
  async function saveDoc(path, data){ await save(); }
  async function deleteDoc(path){ await save(); }

  // ---------- Grid rendering ----------
  function renderGrid(){
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    state.order.forEach(key=>{
      const def = WIDGET_DEFS[key];
      if(!def) return;
      const card = document.createElement('div');
      card.className = 'card' + (def.span===2 ? ' span-2' : '');
      card.style.setProperty('--card-accent', `var(${def.accentVar})`);
      card.draggable = true;
      card.dataset.key = key;
      card.innerHTML = cardPreviewHtml(key, def);
      card.addEventListener('click', (e)=>{
        if(e.target.closest('.drag-handle')) return;
        if(key==='meals') switchTab('meals'); else openModal(key);
      });
      card.addEventListener('dragstart', (e)=>{ draggedWidget = key; card.classList.add('dragging'); });
      card.addEventListener('dragend', ()=>{ card.classList.remove('dragging'); document.querySelectorAll('.card').forEach(c=>c.classList.remove('drag-over')); });
      card.addEventListener('dragover', (e)=>{ e.preventDefault(); if(draggedWidget && draggedWidget!==key) card.classList.add('drag-over'); });
      card.addEventListener('dragleave', ()=> card.classList.remove('drag-over'));
      card.addEventListener('drop', (e)=>{
        e.preventDefault(); card.classList.remove('drag-over');
        if(!draggedWidget || draggedWidget===key) return;
        const from = state.order.indexOf(draggedWidget);
        const to = state.order.indexOf(key);
        state.order.splice(from,1);
        state.order.splice(to,0,draggedWidget);
        draggedWidget = null;
        renderGrid();
        saveDoc('dashboard/layout', { order: state.order });
      });
      grid.appendChild(card);
    });
  }

  function cardPreviewHtml(key, def){
    let body = '';
    let foot = 'Click to open';
    if(key==='meals'){
      const today = todayDayName();
      const t = state.meals[today] || {};
      const items = MEALS_OF_DAY.map(m => t[m] ? `<div class="mini-row"><span>${m}</span><strong>${escapeHtml(t[m])}</strong></div>` : '').filter(Boolean).join('');
      body = items || `<span class="empty-hint">Nothing planned for today yet</span>`;
      foot = `${state.groceries.filter(g=>!g.checked).length} items on grocery list`;
    } else if(key==='workout'){
      const today = todayDayName();
      const t = state.workoutPlan[today];
      body = t && t.focus ? `<strong>${escapeHtml(t.focus)}</strong>${t.notes ? '<br>'+escapeHtml(t.notes) : ''}` : `<span class="empty-hint">Rest day, or nothing planned</span>`;
      const dots = DAYS.map(d => `<span class="streak-dot ${state.workoutLog[d] ? 'done' : ''}"></span>`).join('');
      body += `<div class="streak-dots">${dots}</div>`;
      foot = `${Object.values(state.workoutLog).filter(Boolean).length} of 7 days logged`;
    } else if(key==='content'){
      const counts = { Idea:0, 'In Progress':0, Posted:0 };
      state.content.forEach(c => counts[c.status] = (counts[c.status]||0)+1);
      body = `<div class="mini-list">` + Object.keys(counts).map(s=>`<div class="mini-row"><span>${s}</span><strong>${counts[s]}</strong></div>`).join('') + `</div>`;
      const nextIdea = state.content.find(c=>c.status==='Idea');
      foot = nextIdea ? 'Next idea: ' + (nextIdea.title.length>28 ? nextIdea.title.slice(0,28)+'…' : nextIdea.title) : `${state.content.length} items total`;
    } else if(key==='hobbies'){
      if(state.hobbies.length===0){ body = `<span class="empty-hint">No hobbies added yet</span>`; }
      else {
        body = `<div class="mini-list">` + state.hobbies.slice(0,4).map(h=>`<div class="mini-row"><span>${escapeHtml(h.name)}</span></div>`).join('') + `</div>`;
      }
      foot = `${state.hobbies.length} tracked`;
    } else if(key==='calendar'){
      const upcoming = state.events.filter(e=> new Date(e.date) >= new Date(new Date().toDateString())).slice(0,3);
      if(upcoming.length===0){ body = `<span class="empty-hint">No upcoming events added</span>`; }
      else {
        body = `<div class="mini-list">` + upcoming.map(e=>`<div class="mini-row"><span>${escapeHtml(e.title)}</span><strong>${fmtDateShort(e.date)}</strong></div>`).join('') + `</div>`;
      }
      foot = 'Google Calendar sync: not yet connected';
    }
    return `
      <div class="card-top">
        <div class="card-title"><span class="card-icon ${def.iconClass}">${def.icon}</span>${def.title}</div>
        <span class="drag-handle" title="Drag to reorder">⠿</span>
      </div>
      <div class="card-body">${body}</div>
      <div class="card-foot"><span>${foot}</span><span class="open-link">${key==='meals' ? 'Open tab →' : 'Open →'}</span></div>
    `;
  }

  function fmtDateShort(dateStr){
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString(undefined, { month:'short', day:'numeric' });

    document.getElementById('modalCloseBtn').addEventListener('click', closeModal);

  const KNOWN_UNITS = new Set(['cup','cups','tbsp','tsp','oz','lb','lbs','can','cans','each','clove','cloves','slice','slices','stalk','stalks','head','heads','bunch','bunches','jar','jars','packet','packets','link','links','leaf','leaves','pinch']);

  function parseIngredientLines(text){
    return text.split('\n').map(l=>l.trim()).filter(Boolean).map(line=>{
      const parts = line.split(/\s+/);
      let qty = 1, unit = 'each', item = line;
      const first = parseFloat(parts[0]);
      if(!isNaN(first)){
        qty = first;
        if(parts[1] && KNOWN_UNITS.has(parts[1].toLowerCase())){
          unit = parts[1].toLowerCase();
          item = parts.slice(2).join(' ');
        } else {
          item = parts.slice(1).join(' ');
        }
      }
      return { item: item || line, qty, unit, pantry: false };
    });
  }

  function combinedPool(meal){
    const pool = (RECIPE_POOL[meal]||[]).map(r=>({...r, src:'pool'}));
    const custom = state.customRecipes.filter(r=>r.mealType===meal).map(r=>({...r, src:'custom'}));
    return pool.concat(custom);
  }

  function resolveRecipe(meal, ref){
    if(!ref) return null;
    if(typeof ref === 'string') return findRecipe(meal, ref); // legacy shape
    if(ref.src==='custom') return state.customRecipes.find(r=>r.id===ref.id) || null;
    return findRecipe(meal, ref.id);
  }

  function findCustomByName(meal, name){
    const n = name.trim().toLowerCase();
    return state.customRecipes.find(r=>r.mealType===meal && r.name.trim().toLowerCase()===n);
  }

    const photo = state.mealImages[day] && state.mealImages[day][meal];

    if(recipe){
      ingredientsHtml = `<div class="hobby-notes" data-ing-panel style="display:none; font-size:11.5px; margin-top:4px;">${recipe.ingredients.map(i=>`${i.qty} ${i.unit} ${i.item}`).join(', ')}</div>`;

    return `

        <div style="display:flex; gap:3px; align-items:center;">
          <input type="text" data-day="${day}" data-meal="${meal}" class="meal-input" value="${escapeHtml(val)}" placeholder="—" style="font-size:11.5px; padding:5px 6px;">

  function findRecipe(meal, id){

  function assignRandomRecipe(day, meal, excludeKey){
    const pool = combinedPool(meal);
    let choices = pool;
    if(excludeKey) choices = pool.filter(r=>(r.src+':'+r.id)!==excludeKey);
    const recipe = choices[Math.floor(Math.random()*choices.length)];
    if(!recipe) return;
    if(!state.meals[day]) state.meals[day] = {};
    if(!state.weekRecipes[day]) state.weekRecipes[day] = {};
    state.meals[day][meal] = recipe.name;
    state.weekRecipes[day][meal] = { src: recipe.src, id: recipe.id };
  }

  function generateFullWeek(){
    const distinctTarget = { Breakfast:4, Lunch:5, Dinner:6 };
    MEALS_OF_DAY.forEach(meal=>{
      const pool = combinedPool(meal);
      const n = Math.min(distinctTarget[meal], pool.length);
      const shuffled = [...pool].sort(()=>Math.random()-0.5);
      const chosen = shuffled.slice(0, n);
      const slots = [];
      const bag = [];
      while(slots.length < 7){
        if(bag.length===0){ bag.push(...chosen.sort(()=>Math.random()-0.5)); }
        const candidate = bag.shift();
        if(slots.length>0 && slots[slots.length-1].id===candidate.id && slots[slots.length-1].src===candidate.src && bag.length>0){
          bag.push(candidate);
          continue;
        }
        slots.push(candidate);
      }
      DAYS.forEach((day, i)=>{
        if(!state.meals[day]) state.meals[day] = {};
        if(!state.weekRecipes[day]) state.weekRecipes[day] = {};
        state.meals[day][meal] = slots[i].name;
        state.weekRecipes[day][meal] = { src: slots[i].src, id: slots[i].id };
      });
    });
    saveDoc('dashboard/meals', state.meals);
    saveDoc('dashboard/weekRecipes', state.weekRecipes);
    showToast('Week generated — tweak or 🎲 reroll any single meal');
  }

  function buildGroceryFromWeek(includePantry){
    const agg = {}; // key: item|unit -> {item,unit,qty}
    DAYS.forEach(day=>{
      MEALS_OF_DAY.forEach(meal=>{
        const ref = state.weekRecipes[day] && state.weekRecipes[day][meal];
        if(!ref) return;
        const recipe = resolveRecipe(meal, ref);
        if(!recipe) return;
        recipe.ingredients.forEach(ing=>{
          if(ing.pantry && !includePantry) return;
          const key = ing.item.toLowerCase()+'|'+ing.unit;
          if(!agg[key]) agg[key] = { item: ing.item, unit: ing.unit, qty: 0 };
          agg[key].qty += ing.qty;
        });
      });
    });
    // remove previously auto-generated items, keep manual ones
    const toRemove = state.groceries.filter(g=>g.source==='auto');
    toRemove.forEach(g=> deleteDoc('groceries/'+g.id));
    state.groceries = state.groceries.filter(g=>g.source!=='auto');
    Object.values(agg).forEach(a=>{
      const qtyStr = Number.isInteger(a.qty) ? a.qty : Math.round(a.qty*100)/100;
      const text = `${qtyStr} ${a.unit} ${a.item}`;
      const item = { id: uid(), text, checked:false, source:'auto', createdAt: Date.now() };
      state.groceries.push(item);
      saveDoc('groceries/'+item.id, { text:item.text, checked:item.checked, source:item.source, createdAt:item.createdAt });
    });
  }

  // ---------- Workout ----------
  function renderWorkoutModal(body){
    let html = `<div class="section-label">Weekly plan</div>`;
    DAYS.forEach(day=>{
      const plan = state.workoutPlan[day] || {};
      const done = !!state.workoutLog[day];
      html += `
        <div class="workout-day">
          <div class="workout-day-head">
            <strong>${day}</strong>
            <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);">
              <input type="checkbox" data-log-day="${day}" ${done?'checked':''}> Done
            </label>
          </div>
          <input type="text" data-plan-day="${day}" data-field="focus" placeholder="Focus (e.g. Legs, Rest, Run)" value="${escapeHtml(plan.focus||'')}" style="margin-bottom:6px;">
          <textarea data-plan-day="${day}" data-field="notes" placeholder="Notes / exercises">${escapeHtml(plan.notes||'')}</textarea>
        </div>`;
    });
    body.innerHTML = html;
    body.querySelectorAll('[data-plan-day]').forEach(el=>{
      el.addEventListener('change', ()=>{
        const day = el.dataset.planDay, field = el.dataset.field;
        if(!state.workoutPlan[day]) state.workoutPlan[day] = {};
        state.workoutPlan[day][field] = el.value;
        saveDoc('dashboard/workoutPlan', state.workoutPlan);
      });
    });
    body.querySelectorAll('[data-log-day]').forEach(cb=>{
      cb.addEventListener('change', ()=>{
        state.workoutLog[cb.dataset.logDay] = cb.checked;
        saveDoc('dashboard/workoutLog', state.workoutLog);
      });
    });
  }

  // ---------- Content Creation (kanban) ----------
  const CONTENT_STATUSES = ['Idea','In Progress','Posted'];
  function renderContentModal(body){
    let html = `<div class="kanban">` + CONTENT_STATUSES.map(status=>`
      <div class="kanban-col" data-status="${status}">
        <h4>${status} (${state.content.filter(c=>c.status===status).length})</h4>
        <div class="kanban-cards" data-status-list="${status}"></div>
        ${status==='Idea' ? `<div class="add-row"><input type="text" id="newContentInput" placeholder="New idea…"><button class="btn btn-primary" id="addContentBtn">Add</button></div>` : ''}
      </div>`).join('') + `</div>`;
    body.innerHTML = html;
    renderKanbanCards();

    body.querySelectorAll('.kanban-col').forEach(col=>{
      col.addEventListener('dragover', (e)=>{ e.preventDefault(); col.classList.add('drag-over'); });
      col.addEventListener('dragleave', ()=> col.classList.remove('drag-over'));
      col.addEventListener('drop', (e)=>{
        e.preventDefault(); col.classList.remove('drag-over');
        if(!draggedKanbanCard) return;
        const item = state.content.find(c=>c.id===draggedKanbanCard);
        if(item){
          item.status = col.dataset.status;
          saveDoc('content/'+item.id, { title:item.title, status:item.status, notes:item.notes||'', createdAt:item.createdAt });
        }
        draggedKanbanCard = null;
        renderKanbanCards();
      });
    });

    const addBtn = body.querySelector('#addContentBtn');
    if(addBtn){
      addBtn.addEventListener('click', addContentItem);
      body.querySelector('#newContentInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') addContentItem(); });
    }

    function renderKanbanCards(){
      CONTENT_STATUSES.forEach(status=>{
        const list = body.querySelector(`[data-status-list="${status}"]`);
        const items = state.content.filter(c=>c.status===status);
        list.innerHTML = items.map(c=>`
          <div class="kanban-card" draggable="true" data-id="${c.id}">
            <div>${escapeHtml(c.title)}</div>
            ${c.notes ? `<div style="color:var(--ink-faint);font-size:11.5px;margin-top:4px;">${escapeHtml(c.notes)}</div>` : ''}
            <div style="text-align:right;margin-top:4px;"><button class="btn-danger" data-del-content="${c.id}">Remove</button></div>
          </div>`).join('');
        list.querySelectorAll('.kanban-card').forEach(card=>{
          card.addEventListener('dragstart', ()=>{ draggedKanbanCard = card.dataset.id; card.classList.add('dragging'); });
          card.addEventListener('dragend', ()=> card.classList.remove('dragging'));
        });
        list.querySelectorAll('[data-del-content]').forEach(btn=>{
          btn.addEventListener('click', (e)=>{
            e.stopPropagation();
            const id = btn.dataset.delContent;
            state.content = state.content.filter(c=>c.id!==id);
            deleteDoc('content/'+id);
            renderKanbanCards();
          });
        });
      });
    }
    function addContentItem(){
      const input = body.querySelector('#newContentInput');
      const title = input.value.trim();
      if(!title) return;
      const item = { id: uid(), title, status:'Idea', notes:'', createdAt: Date.now() };
      state.content.push(item);
      saveDoc('content/'+item.id, { title:item.title, status:item.status, notes:item.notes, createdAt:item.createdAt });
      input.value = '';
      renderKanbanCards();
    }
  }

  // ---------- Hobbies ----------
  function renderHobbiesModal(body){
    let html = `<div id="hobbiesList"></div>
      <div class="add-row"><input type="text" id="newHobbyInput" placeholder="Add a hobby or creative venture…"><button class="btn btn-primary" id="addHobbyBtn">Add</button></div>`;
    body.innerHTML = html;
    renderList();
    body.querySelector('#addHobbyBtn').addEventListener('click', addHobby);
    body.querySelector('#newHobbyInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') addHobby(); });

    function renderList(){
      const list = body.querySelector('#hobbiesList');
      if(state.hobbies.length===0){ list.innerHTML = `<p class="empty-state">Nothing tracked yet — add a hobby or project below.</p>`; return; }
      list.innerHTML = state.hobbies.map(h=>`
        <div class="hobby-item" data-id="${h.id}">
          <div class="hobby-item-head">
            <strong>${escapeHtml(h.name)}</strong>
            <button class="btn-danger" data-del-hobby="${h.id}">Remove</button>
          </div>
          <textarea data-hobby-notes="${h.id}" placeholder="Notes, progress, ideas…" style="margin-top:8px;">${escapeHtml(h.notes||'')}</textarea>
        </div>`).join('');
      list.querySelectorAll('[data-hobby-notes]').forEach(ta=>{
        ta.addEventListener('change', ()=>{
          const id = ta.dataset.hobbyNotes;
          const h = state.hobbies.find(x=>x.id===id);
          h.notes = ta.value;
          saveDoc('hobbies/'+id, { name:h.name, notes:h.notes, createdAt:h.createdAt });
        });
      });
      list.querySelectorAll('[data-del-hobby]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const id = btn.dataset.delHobby;
          state.hobbies = state.hobbies.filter(h=>h.id!==id);
          deleteDoc('hobbies/'+id);
          renderList();
        });
      });
    }
    function addHobby(){
      const input = body.querySelector('#newHobbyInput');
      const name = input.value.trim();
      if(!name) return;
      const item = { id: uid(), name, notes:'', createdAt: Date.now() };
      state.hobbies.push(item);
      saveDoc('hobbies/'+item.id, { name:item.name, notes:item.notes, createdAt:item.createdAt });
      input.value = '';
      renderList();
    }
  }

  // ---------- Calendar ----------
  function renderCalendarModal(body){
    let html = `<div class="banner show" style="margin-bottom:16px;">Google Calendar sync isn't connected yet — once it is, your school and personal events will appear here alongside these. For now, add your own below.</div>`;
    html += `<div class="section-label">Add an event</div>
      <div class="event-form">
        <input type="text" id="evTitle" placeholder="Title" class="full">
        <input type="date" id="evDate">
        <input type="time" id="evTime">
        <textarea id="evNotes" placeholder="Notes (optional)" class="full"></textarea>
      </div>
      <div style="margin-top:8px;"><button class="btn btn-primary" id="addEventBtn">Add event</button></div>`;
    html += `<div class="section-label">Upcoming</div><div id="eventsList"></div>`;
    body.innerHTML = html;
    renderEvents();
    body.querySelector('#addEventBtn').addEventListener('click', addEvent);

    function renderEvents(){
      const list = body.querySelector('#eventsList');
      const upcoming = state.events.filter(e=> new Date(e.date) >= new Date(new Date().toDateString()));
      if(upcoming.length===0){ list.innerHTML = `<p class="empty-state">No upcoming events yet.</p>`; return; }
      list.innerHTML = upcoming.map(e=>`
        <div class="event-row" data-id="${e.id}">
          <div class="event-date-badge">${fmtDateShort(e.date)}${e.time ? ' · '+fmtTime(e.time) : ''}</div>
          <div class="event-info">
            <strong>${escapeHtml(e.title)}</strong>
            ${e.notes ? `<p>${escapeHtml(e.notes)}</p>` : ''}
          </div>
          <button class="btn-danger" data-del-event="${e.id}">Remove</button>
        </div>`).join('');
      list.querySelectorAll('[data-del-event]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const id = btn.dataset.delEvent;
          state.events = state.events.filter(e=>e.id!==id);
          deleteDoc('events/'+id);
          renderEvents();
        });
      });
    }
    function addEvent(){
      const title = body.querySelector('#evTitle').value.trim();
      const date = body.querySelector('#evDate').value;
      const time = body.querySelector('#evTime').value;
      const notes = body.querySelector('#evNotes').value.trim();
      if(!title || !date){ showToast('Add a title and date'); return; }
      const item = { id: uid(), title, date, time, notes, createdAt: Date.now() };
      state.events.push(item);
      state.events.sort((a,b)=>new Date(a.date)-new Date(b.date));
      saveDoc('events/'+item.id, { title:item.title, date:item.date, time:item.time, notes:item.notes, createdAt:item.createdAt });
      body.querySelector('#evTitle').value = '';
      body.querySelector('#evDate').value = '';
      body.querySelector('#evTime').value = '';
      body.querySelector('#evNotes').value = '';
      renderEvents();
    }
  }
  function fmtTime(t){
    const [h,m] = t.split(':').map(Number);
    const period = h>=12 ? 'PM' : 'AM';
    const h12 = h%12===0 ? 12 : h%12;
    return `${h12}:${String(m).padStart(2,'0')} ${period}`;
  }

  // ---------- Init ----------
  function renderHomeView(container){
    const board = state.visionBoard;
    const boardHtml = board.map(img => `
        <div class="vision-item">
          <img src="${img.src}" data-lightbox-src="${img.src}" data-lightbox-caption="${escapeHtml(img.caption||'')}" alt="${escapeHtml(img.caption||'')}">
          <button class="vision-remove" data-remove-vision="${img.id}" title="Remove">✕</button>
        </div>`).join('');

    container.innerHTML = `
      <div class="vision-head">
        <h2 style="margin:0;">Vision Board</h2>
        <label class="btn btn-primary vision-upload-btn">+ Add images<input type="file" accept="image/*" multiple id="visionUploadInput" style="display:none;"></label>
      </div>
      ${board.length
        ? `<div class="vision-board" id="visionBoardGrid">${boardHtml}</div>`
        : `<div class="vision-empty">
             <p style="font-family:'Playfair Display',serif; font-size:18px; margin:0 0 6px;">Your vision board starts here</p>
             <p class="empty-hint" style="font-size:12.5px; margin:0;">Add photos, inspiration, goals — whatever you want to see every time you open this.</p>
           </div>`}
    `;

    container.querySelectorAll('[data-lightbox-src]').forEach(img=>{
      img.addEventListener('click', ()=> openImageLightbox(img.dataset.lightboxSrc, img.dataset.lightboxCaption||''));
    });
    container.querySelectorAll('[data-remove-vision]').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        const id = btn.dataset.removeVision;
        state.visionBoard = state.visionBoard.filter(v=>v.id!==id);
        saveDoc('dashboard/visionBoard', state.visionBoard);
        renderHomeView(container);
      });
    });
    const uploadInput = container.querySelector('#visionUploadInput');
    uploadInput.addEventListener('change', async ()=>{
      const files = Array.from(uploadInput.files || []);
      if(files.length===0) return;
      for(const file of files){
        try{
          const dataUrl = await compressImageFile(file, 700, 0.75);
          state.visionBoard.push({ id: uid(), src: dataUrl, caption: '', createdAt: Date.now() });
        } catch(e){ /* skip a file that fails to read */ }
      }
      saveDoc('dashboard/visionBoard', state.visionBoard);
      renderHomeView(container);
      showToast(files.length>1 ? 'Added to your vision board' : 'Added to your vision board');
    });
  }

  function renderTodayView(container){
    const today = todayDayName();
    const todayISO = isoDate(new Date());
    const dateLabel = new Date().toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'});

    const mealsHtml = MEALS_OF_DAY.map(meal=>{
      const name = (state.meals[today] && state.meals[today][meal]) || '';
      const photo = state.mealImages[today] && state.mealImages[today][meal];
      return `<div class="today-meal-row">
        ${photo
          ? `<img src="${photo}" class="today-meal-thumb" data-lightbox-src="${photo}" data-lightbox-caption="${escapeHtml(name)}" alt="${escapeHtml(name)}">`
          : `<div class="today-meal-thumb today-meal-thumb-empty">🍽</div>`}
        <div>
          <div class="today-meal-label">${meal}</div>
          <div class="today-meal-name">${name ? escapeHtml(name) : '<span class="empty-hint">Not planned</span>'}</div>
        </div>
      </div>`;
    }).join('');

    const wPlan = state.workoutPlan[today] || {};
    const wDone = !!state.workoutLog[today];

    const todaysEvents = state.events.filter(e=> e.date === todayISO);
    const eventsHtml = todaysEvents.length
      ? todaysEvents.map(e=>`<div class="today-event-row">${e.time ? `<span class="pill">${fmtTime(e.time)}</span>` : ''}<span>${escapeHtml(e.title)}</span></div>`).join('')
      : `<p class="empty-hint" style="font-size:12.5px;">Nothing on your calendar today.</p>`;

    container.innerHTML = `
      <h1 class="display" style="font-size:26px; font-weight:450; margin:0 0 2px;">Today</h1>
      <p style="color:var(--ink-soft); font-size:14px; margin:0 0 22px;">${dateLabel}</p>
      <div class="today-grid">
        <div class="today-card">
          <div class="today-card-head"><span class="card-icon icon-meal">🍽</span><strong>Meals</strong><button class="btn btn-ghost today-link" id="todayJumpMeals">Edit →</button></div>
          ${mealsHtml}
        </div>
        <div class="today-card">
          <div class="today-card-head"><span class="card-icon icon-workout">🏋</span><strong>Workout</strong><button class="btn btn-ghost today-link" id="todayJumpWorkout">Open →</button></div>
          ${wPlan.focus ? `<div class="today-workout-focus">${escapeHtml(wPlan.focus)}</div>${wPlan.notes?`<div class="today-workout-notes">${escapeHtml(wPlan.notes)}</div>`:''}` : `<p class="empty-hint" style="font-size:12.5px;">Nothing planned today.</p>`}
          <label class="today-done-toggle"><input type="checkbox" id="todayWorkoutDone" ${wDone?'checked':''}> Mark today's workout done</label>
        </div>
        <div class="today-card">
          <div class="today-card-head"><span class="card-icon icon-cal">◐</span><strong>Calendar</strong><button class="btn btn-ghost today-link" id="todayJumpCalendar">Open →</button></div>
          ${eventsHtml}
        </div>
      </div>
    `;

    container.querySelectorAll('[data-lightbox-src]').forEach(img=>{
      img.addEventListener('click', ()=> openImageLightbox(img.dataset.lightboxSrc, img.dataset.lightboxCaption||''));
    });
    container.querySelector('#todayJumpMeals').addEventListener('click', ()=> switchTab('meals'));
    container.querySelector('#todayJumpWorkout').addEventListener('click', ()=> openModal('workout'));
    container.querySelector('#todayJumpCalendar').addEventListener('click', ()=> openModal('calendar'));
    const doneToggle = container.querySelector('#todayWorkoutDone');
    doneToggle.addEventListener('change', ()=>{
      state.workoutLog[today] = doneToggle.checked;
      saveDoc('dashboard/workoutLog', state.workoutLog);
      showToast(doneToggle.checked ? "Nice work — logged!" : 'Unmarked');
    });
  }

  function switchTab(name){
    document.querySelectorAll('.tab-btn').forEach(b=> b.classList.toggle('active', b.dataset.tab===name));
    document.getElementById('homeView').style.display = name==='home' ? '' : 'none';
    document.getElementById('todayView').style.display = name==='today' ? '' : 'none';
    document.getElementById('dashboardView').style.display = name==='dashboard' ? '' : 'none';
    document.getElementById('mealsView').style.display = name==='meals' ? '' : 'none';
    if(name==='home') renderHomeView(document.getElementById('homeView'));
    if(name==='today') renderTodayView(document.getElementById('todayView'));
    if(name==='meals') renderMealsModal(document.getElementById('mealsView'));
  }
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> switchTab(btn.dataset.tab));
  });

  greet();
  renderGrid();
  renderHomeView(document.getElementById('homeView'));
  load();
})();
</script>
</body>
